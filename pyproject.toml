[project]
name = "bearing-rul-pipeline"
version = "0.1.0"
description = "Signal-processing pipeline for rolling-element bearing degradation: raw vibration -> windowed features -> health index -> RUL estimation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bearing_pdm*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: flags function calls in argument defaults because mutable defaults
# get shared across calls. BearingGeometry is a frozen (immutable)
# dataclass, so fault_frequencies.py's `geometry: BearingGeometry =
# BearingGeometry()` default is safe -- the concern the rule guards
# against doesn't apply here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks exported as .py source. F821: `spark`, `display` and
# `dbutils` are globals the Databricks runtime injects into every notebook.
# E402: each notebook has to put the repo root on sys.path before it can
# import bearing_pdm, so those imports cannot sit at the top of the file.
"databricks/*.py" = ["F821", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
